<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Mistral Email Assistant - Nieuwe E-mail</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1.1/host/office.js" type="text/javascript"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" type="text/javascript"></script>
    <script src="compose.js" type="text/javascript"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mistral Email Assistant</h1>
            <p class="subtitle">Nieuwe e-mail genereren met AI</p>
        </div>

        <div class="section">
            <h2>E-mail Specificaties</h2>
            <div class="form-container">
                <div class="form-group">
                    <label for="compose-subject">Onderwerp:</label>
                    <input type="text" id="compose-subject" placeholder="Voer een onderwerp in" />
                </div>

                <div class="form-group">
                    <label for="compose-to">Aan:</label>
                    <input type="text" id="compose-to" placeholder="Voer e-mailadressen in, gescheiden door komma's" />
                </div>

                <div class="form-group">
                    <label for="compose-cc">CC:</label>
                    <input type="text" id="compose-cc" placeholder="CC e-mailadressen, gescheiden door komma's" />
                </div>

                <div class="form-group">
                    <label for="compose-content">Inhoud/Context:</label>
                    <textarea id="compose-content" rows="5" placeholder="Beschrijf de inhoud of context voor de e-mail..."></textarea>
                </div>

                <div class="form-group">
                    <label for="compose-tone">Toon:</label>
                    <select id="compose-tone">
                        <option value="">Standaard (professioneel)</option>
                        <option value="formeel">Formeel</option>
                        <option value="informele">Informeel</option>
                        <option value="vriendelijk">Vriendelijk</option>
                        <option value="dringend">Dringend</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="compose-style">Stijl:</label>
                    <select id="compose-style">
                        <option value="">Standaard</option>
                        <option value="beknopt">Beknopt</option>
                        <option value="uitgebreid">Uitgebreid</option>
                        <option value="technisch">Technisch</option>
                        <option value="creatief">Creatief</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="compose-model">Model:</label>
                    <select id="compose-model">
                        <option value="mistral-tiny">mistral-tiny (snel)</option>
                        <option value="mistral-small">mistral-small (gebalanceerd)</option>
                        <option value="mistral-medium">mistral-medium (krachtig)</option>
                        <option value="mistral-large">mistral-large (expert)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="compose-creativity">Creativiteit:</label>
                    <input type="range" id="compose-creativity" min="0.1" max="1" step="0.1" value="0.7" />
                    <span id="creativity-value">0.7</span>
                </div>

                <button id="btn-generate-email" class="btn btn-primary">Genereer E-mail</button>
            </div>
        </div>

        <div class="section" id="generated-email-section" style="display: none;">
            <h2>Gegenereerde E-mail</h2>
            <div class="email-preview">
                <div class="loading" id="generating-indicator">
                    <div class="spinner"></div>
                    <p>Mistral AI aan het genereren...</p>
                </div>
                <div class="generated-content" id="generated-email"></div>
            </div>
            <div class="action-buttons" style="margin-top: 15px;">
                <button id="btn-use-email" class="btn btn-primary">Gebruik deze e-mail</button>
                <button id="btn-regenerate" class="btn btn-secondary">Opnieuw genereren</button>
            </div>
        </div>

        <div class="footer">
            <p>Powered by Mistral AI | <a href="https://mistral.ai" target="_blank">mistral.ai</a></p>
        </div>
    </div>
</body>
</html>
